  #     - name: Install Dependencies
  #       run: |
  #         npm ci

  #     - name: Lint src code
  #       run: npm run lint

  Windows:
    name: Windows
    runs-on: windows-latest
    # needs: CheckCode
    steps:
      - name: Check out git repository
        uses: actions/checkout@v4

      - name: Get npm cache directory
        shell: pwsh
        run: echo "NPM_CACHE=$(npm config get cache)" >> $env:GITHUB_ENV

      - name: Setup Node Env
        env:
          NPM_CACHE: ${{ env.NPM_CACHE }}
        uses: ./.github/actions/setup

      - name: Build src code
        run: |
          git status --porcelain
          npm run build

      - name: Build Package Setup x64
        run: npm run pack:win:setup:x64
      - name: Upload Artifact Setup x64
        uses: actions/upload-artifact@v4
        with:
          name: ikun-music-desktop-x64-Setup
          path: build/*-x64-Setup.exe

      - name: Build Package 7z x64
        run: npm run pack:win:7z:x64
      - name: Upload Artifact 7z x64
        uses: actions/upload-artifact@v4
        with:
          name: ikun-music-desktop-win_x64-green
          path: build/*win_x64-green.7z

      - name: Build Package Setup arm64
        run: npm run pack:win:setup:arm64
      - name: Upload Artifact Setup arm64
        uses: actions/upload-artifact@v4
        with:
          name: ikun-music-desktop-arm64-Setup
          path: build/*-arm64-Setup.exe

      - name: Build Package 7z arm64
        run: npm run pack:win:7z:arm64
      - name: Upload Artifact 7z arm64
        uses: actions/upload-artifact@v4
        with:
          name: ikun-music-desktop-win_arm64-green
          path: build/*win_arm64-green.7z

      - name: Generate file MD5
        run: |
          cd build
          Get-FileHash *.exe,*.7z -Algorithm MD5 | Format-List

  Mac:
    name: Mac
    runs-on: macos-latest
    # needs: CheckCode
    steps:
      - name: Check out git repository
        uses: actions/checkout@v4

      - name: Install python setuptools
        run: brew install python-setuptools

      - name: Get npm cache directory
        shell: bash
        run: echo "NPM_CACHE=$(npm config get cache)" >> $GITHUB_ENV

      - name: Setup Node Env
        env:
          NPM_CACHE: ${{ env.NPM_CACHE }}
        uses: ./.github/actions/setup

      - name: Build src code
        run: |
          git status --porcelain
          npm run build

      - name: Build Package dmg
        run: |
          npm run pack:mac:dmg
          npm run pack:mac:dmg:arm64

      - name: Upload Artifact dmg
        uses: actions/upload-artifact@v4
        with:
          name: ikun-music-desktop-mac-dmg
          path: |
            build/*.dmg
            !build/*-arm64.dmg
      - name: Upload Artifact dmg
        uses: actions/upload-artifact@v4
        with:
          name: ikun-music-desktop-mac-dmg-arm64
          path: build/*-arm64.dmg

      - name: Generate file MD5
        run: |
          cd build
          md5 *.dmg

  Release:
    name: Publish Release
    needs: [Windows, Mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out git repository
        uses: actions/checkout@v4

      - name: Read commit subject
        id: meta
        run: echo "subject=$(git log -1 --pretty=%s)" >> "$GITHUB_OUTPUT"

      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          pattern: ikun-music-desktop-*
          path: release-assets
          merge-multiple: true

      - name: Publish packages to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beta-${{ github.run_number }}
          name: beta-${{ github.run_number }} — ${{ steps.meta.outputs.subject }}
          prerelease: true
          generate_release_notes: false
          body: |
            ## beta-${{ github.run_number }} — ${{ steps.meta.outputs.subject }}

            本次为 `beta` 分支的自动构建，源码 `${{ github.sha }}`。

            ### 说明
            - 附件按平台与架构命名，选择与自己系统对应的包
            - Windows：x64 / arm64 安装包（Setup）与便携版（7z）
            - macOS：x64 / arm64 DMG

            ### 致谢
            核心功能来自原作者项目：[lyswhut/lx-music-desktop](https://github.com/lyswhut/lx-music-desktop) 与 [ikunshare/ikun-music-desktop](https://github.com/ikunshare/ikun-music-desktop)。
            本仓库仅作界面与交互修改，按 Apache-2.0 分发，原始版权归原作者所有。
          files: release-assets/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
